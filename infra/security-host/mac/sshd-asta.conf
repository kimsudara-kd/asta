# /etc/ssh/sshd_config.d/200-asta.conf  - PREPARED, NOT INSTALLED (M3-B-R4).
# Install only in an approved execution window and only if inbound SSH is actually required (owner decision D-B3).
# macOS 26 reads /etc/ssh/sshd_config.d/*.conf in lexical order; the first value wins, so this file sorts BEFORE
# 100-macos.conf only if it is named 000-*: name it /etc/ssh/sshd_config.d/000-asta.conf when installing.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers apple
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 60
ClientAliveCountMax 3
# Restrict to the tailnet (and drop the LAN) by listening only on the Tailscale address, e.g.:
# ListenAddress 100.x.y.z        (the host's tailnet IPv4, from `tailscale ip -4`)
