#!/usr/sbin/nft -f
# ASTA Mac-mini deployment: application VM "asta-app" (Linux ARM64): paper service, supervisor, API,
# PostgreSQL (localhost/unix socket only). It NEVER holds credentials (those live only on asta-cred).
# DESIGN ARTIFACT (M3A-MAC-01). Output only to the firewall VM's proxy; no inbound at all (console admin).
flush ruleset

define FW_IP = 10.77.1.1

table inet asta_app {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    # (M3-B, NOT authorized: intents channel from the app VM is outbound-only, nothing is accepted here)
    limit rate 5/minute log prefix "ASTA-APP-IN-DROP "
    counter drop
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    counter drop
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    oifname "fw0" ip daddr $FW_IP tcp dport 3128 accept
    # (M3-B, NOT authorized, interface cred0 not attached): order-intent channel to asta-cred
    #   oifname "cred0" ip daddr 10.77.3.2 tcp dport 7443 accept
    limit rate 5/minute log prefix "ASTA-APP-OUT-DROP "
    counter drop
  }
}
