#!/usr/sbin/nft -f
# ASTA protected-runtime VM ("asta-rt"): NO uplink and NO default route. DESIGN ARTIFACT (M3A-R2).
# The only reachable peer is the firewall VM's proxy port. Everything else, IPv6 included, is dropped
# locally even if the hypervisor/virtual switch were misconfigured (defence in depth).
flush ruleset

define FIREWALL_IP = 10.77.0.1
define ADMIN_JUMP  = 10.77.0.2     # optional admin jump host on the private switch (console preferred)

table inet asta_rt {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    iifname "prot0" ip saddr $ADMIN_JUMP tcp dport 22 accept
    limit rate 5/minute log prefix "ASTA-RT-IN-DROP "
    counter drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    counter drop
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    # the egress proxy, nothing else (no DNS: names are resolved by the proxy, clients use CONNECT host:port)
    oifname "prot0" ip daddr $FIREWALL_IP tcp dport 3128 accept
    limit rate 5/minute log prefix "ASTA-RT-OUT-DROP "
    counter drop
  }
}
