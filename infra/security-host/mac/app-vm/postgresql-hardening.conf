# /etc/postgresql/16/main/conf.d/asta-hardening.conf (applied on asta-app)
listen_addresses = ''            # unix socket only: no TCP listener at all
unix_socket_permissions = 0770
password_encryption = scram-sha-256
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
ssl = off                        # no network path to protect; the socket is local
