# /etc/netplan/50-asta.yaml on the firewall VM (design artifact; interface names are examples).
# prot0 = private switch "asta-prot" (no uplink, no host adapter); up0 = the only uplink.
network:
  version: 2
  renderer: networkd
  ethernets:
    prot0:
      addresses: [10.77.0.1/24]
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
    up0:
      dhcp4: true            # or a static address on the router segment
      dhcp6: false
      accept-ra: false
      link-local: []
      dhcp4-overrides:
        use-dns: false       # DNS upstream is pinned in nftables.conf, not taken from DHCP
