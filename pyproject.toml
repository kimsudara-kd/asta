[project]
name = "asta"
version = "0.0.1"
description = "ASTA - spot-only crypto trading research and simulation (M0: foundation and safety). NO LIVE TRADING."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13",
  "pg8000>=1.31",
  "httpx>=0.27",
  "websockets>=13",
  "pyotp>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100,<6.140",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "respx>=0.21",
  "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
  "db: needs a PostgreSQL test database (ASTA_TEST_DATABASE_URL)",
  "network: opt-in live public-endpoint smoke test (ASTA_RUN_NETWORK_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

