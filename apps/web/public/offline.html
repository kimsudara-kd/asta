<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d13">
<title>ASTA - offline</title>
<style>
  :root { color-scheme: dark light; --bg:#090d13; --surface:#111923; --line:#1f2b39; --text:#e9eff6; --muted:#8493a4; --accent:#5b94ff; --warn:#e6ad2e; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3f5f9; --surface:#fff; --line:#e2e8f0; --text:#0f1824; --muted:#5b6878; --accent:#2563eb; --warn:#8a5a00; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text);
         font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif; }
  .card { width:min(100%,420px); padding:28px 26px; background:var(--surface); border:1px solid var(--line); border-radius:16px; text-align:center; }
  .mark { width:48px; height:48px; margin:0 auto 14px; border-radius:14px; display:grid; place-items:center;
          background:linear-gradient(135deg,#5b94ff,#8b6cff); }
  .mark svg { width:26px; height:26px; }
  h1 { margin:0 0 8px; font-size:21px; letter-spacing:-.015em; }
  p { margin:0 0 12px; color:var(--muted); }
  .note { margin-top:18px; padding:9px 12px; border-radius:10px; font-size:12.5px; font-weight:600; color:var(--warn);
          background:color-mix(in srgb,var(--warn) 13%,transparent); }
  a.btn { display:inline-block; margin-top:6px; padding:12px 22px; min-height:44px; border-radius:10px; background:var(--accent);
          color:#0a1020; font-weight:650; text-decoration:none; }
  @media (prefers-color-scheme: light) { a.btn { color:#fff; } }
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#0a1020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5.5-7 4 4L20 6"/></svg></div>
  <h1>You're offline</h1>
  <p>ASTA needs a connection to its local API. Nothing is stored on this device: no market data, no account data.</p>
  <a class="btn" href="/">Try again</a>
  <div class="note">PAPER · SIMULATION ONLY · NO TRADING · NO REAL FUNDS</div>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
