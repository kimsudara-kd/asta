name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# No exchange credentials exist in CI. Tests use recorded fixtures and a throw-away Postgres.
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: asta_test
          POSTGRES_PASSWORD: asta_test_only
          POSTGRES_DB: asta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asta_test" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      ASTA_TEST_DATABASE_URL: postgresql+pg8000://asta_test:asta_test_only@127.0.0.1:5432/asta_test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m pytest tests -q
      - name: Dependency audit
        run: uv run pip-audit
      - name: Secret scan (history)
        run: uv run python scripts/secret_scan.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITLEAKS_VERSION: "8.30.1"   # pinned (M3-B-R4): the version used for the local full-history scans; the action otherwise uses a hard-coded version of its own

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
