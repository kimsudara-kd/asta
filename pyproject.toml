[project]
name = "asta"
version = "0.0.1"
description = "ASTA - spot-only crypto trading research and simulation (M0: foundation and safety). NO LIVE TRADING."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13",
  "pg8000>=1.31",
  "httpx>=0.27",
  "websockets>=13",
  "pyotp>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100,<6.140",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "respx>=0.21",
  "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
  "db: needs a PostgreSQL test database (ASTA_TEST_DATABASE_URL)",
  "network: opt-in live public-endpoint smoke test (ASTA_RUN_NETWORK_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/asta/research/**" = ["E501"]
"src/asta/paper/**" = ["E501"]
"src/asta/paper_service.py" = ["E501"]  # formatter-managed; long literal lines in tables
"scripts/*.py" = ["E501"]
"proposals/**" = ["E501"]
"tests/security/test_synthetic_signer.py" = ["E501"]
"tests/security/test_testnet_connector.py" = ["E501"]
"tests/security/test_credential_service.py" = ["E501"]
"tests/orders/test_extwire.py" = ["E501"]
"tests/orders/test_external_port.py" = ["E501"]
"tests/live_lock/test_gateway_matrix.py" = ["E501"]
"tests/orders/test_gateway_enabled_boundary.py" = ["E501"]
"tests/integration/test_offhost_alerts.py" = ["S603", "S607"]
"scripts/paper_supervisor.py" = ["E501", "S603", "S607"]
"tests/m3a/test_egress.py" = ["S603", "S607"]  # docker CLI calls into the protected container
"tests/m3a/test_security_host_config.py" = ["S603", "S607"]
"tests/m3a/test_mac_rollback_host.py" = ["S603", "S607", "E501"]
"tests/m3a/test_backup_key_rehearsal.py" = ["S603", "S607", "E501"]
"tests/m3a/test_qemu_pin.py" = ["S603", "S607", "E501"]
"tests/m3a/test_ci_security_gates.py" = ["E501", "E731"]
"tests/m3a/test_vault_recovery_rehearsal.py" = ["S603", "S607", "E501"]
"infra/security-host/acceptance/vault_recovery_rehearsal.py" = ["E501"]
"scripts/docker_pg_volume_verify.py" = ["E501", "S603", "S607"]
"scripts/history_scrub.py" = ["E501", "S603", "S607"]
"scripts/privacy_scan.py" = ["E501", "S603", "S607"]
"tests/m3a/test_backup_key_replace.py" = ["S603", "S607", "E501"]
"infra/security-host/mac/qemu_pin.py" = ["E501", "S603", "S607"]
"tests/m3a/test_mac_provision_host.py" = ["S603", "S607", "E501"]  # docker run of `nft -c` (check only)
"infra/egress/*.py" = ["E501", "ASYNC240"]
"infra/security-host/**/*.py" = ["E501", "S603", "S607"]  # standalone acceptance/provisioning scripts
"tests/m3a/test_provisioning_artifacts.py" = ["S603", "S607", "E501"]
"tests/m3a/test_mac_deployment.py" = ["S603", "S607", "E501", "S108"]  # standalone infra scripts (stdlib only)
"migrations/versions/*.py" = ["E501"]
"tests/integration/test_m3b_integrity.py" = ["E501"]  # dense SQL/ledger fixtures
"tests/orders/test_gateway_boundary.py" = ["E501"]
"tests/orders/test_channel_hardening.py" = ["E501"]
"tests/integration/test_risk_bridge.py" = ["E501"]
"tests/integration/test_bridge_supervision.py" = ["E501", "E731"]
"src/asta/db/research_*.py" = ["E501"]
"src/asta/api/research.py" = ["E501"]
"src/asta/api/paper.py" = ["E501"]
"src/asta/research_jobs.py" = ["E501"]
"tests/research/**" = ["S105", "S106", "S311", "E501"]
"tests/live_lock/test_paper_boundaries.py" = ["E501"]
"tests/paper/**" = ["S105", "S106", "S311", "S608", "E501"]
"tests/integration/test_research_*.py" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

# Product code stays fully strict. Test functions may be unannotated (pytest fixtures/params),
# but their bodies are still type-checked.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
