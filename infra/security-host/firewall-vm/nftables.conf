#!/usr/sbin/nft -f
# ASTA firewall/proxy VM ("asta-fw"): the ONLY host with an uplink. DESIGN ARTIFACT (M3A-R2): not
# deployed anywhere; syntax-checked in CI-less form by tests/m3a/test_security_host_config.py.
# Interfaces: prot0 = private switch "asta-prot" (10.77.0.0/24, no uplink); up0 = uplink.
# Policy: default DROP everywhere (IPv6 included: the inet family has no IPv6 accept rule except lo).
flush ruleset

define PROT_NET   = 10.77.0.0/24
define RUNTIME_IP = 10.77.0.10
define UPSTREAM_DNS = { 192.168.1.1 }   # the router/resolver this VM may query (set at deployment)

table inet asta_fw {
  # addresses that the allowlisted names resolved to (public unicast IPv4 only), filled by
  # asta-allowlist-refresh.sh; entries expire if not refreshed
  set allowed_dst {
    type ipv4_addr
    flags timeout
    timeout 15m
  }

  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    # the proxy is reachable from the runtime VM only
    iifname "prot0" ip saddr $RUNTIME_IP tcp dport 3128 accept
    limit rate 5/minute log prefix "ASTA-FW-IN-DROP "
    counter drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    counter drop                      # this VM never routes
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    # allowlisted public destinations only, allowlisted ports only, TCP only
    oifname "up0" ip daddr @allowed_dst tcp dport { 443, 9443 } accept
    # name resolution ONLY for root (the refresh job); the proxy user has no DNS egress at all
    # (it resolves from a hosts file written by the refresh job), so no DNS tunnelling path
    oifname "up0" meta skuid 0 ip daddr $UPSTREAM_DNS udp dport 53 accept
    oifname "up0" meta skuid 0 ip daddr $UPSTREAM_DNS tcp dport 53 accept
    # NTP to the same upstream (time must stay correct for signatures/audit)
    oifname "up0" meta skuid 0 ip daddr $UPSTREAM_DNS udp dport 123 accept
    limit rate 5/minute log prefix "ASTA-FW-OUT-DROP "
    counter drop
  }
}
