#!/usr/sbin/nft -f
# ASTA Mac-mini deployment: firewall/proxy VM "asta-fw" (Linux ARM64). The ONLY VM with an uplink.
# DESIGN ARTIFACT (M3A-MAC-01), not deployed. Links: app0 = point-to-point to asta-app (10.77.1.0/30),
# cred0 = point-to-point to asta-cred (10.77.2.0/30), up0 = bridged uplink (the Mac's Ethernet).
# Default DROP everywhere (IPv6 only loopback). This VM never forwards: app and cred cannot reach each
# other or the Internet through it, only its proxy.
flush ruleset

define APP_IP  = 10.77.1.2
define CRED_IP = 10.77.2.2
define UPSTREAM_DNS = { 8.8.8.8, 1.1.1.1 }   # M3-B-R6: the resolvers this LAN actually uses (the router does NOT serve DNS); re-render at deployment
define NTP_SERVERS = { 162.159.200.1, 162.159.200.123 }   # M3-B-R6: explicit time servers (the router does NOT serve NTP); re-render at deployment

table inet asta_fw {
  set allowed_dst {
    type ipv4_addr
    flags timeout
    timeout 15m
  }

  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    iifname "app0"  ip saddr $APP_IP  tcp dport 3128 accept
    iifname "cred0" ip saddr $CRED_IP tcp dport 3128 accept
    limit rate 5/minute log prefix "ASTA-FW-IN-DROP "
    counter drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    counter drop
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    oifname "up0" ip daddr @allowed_dst tcp dport { 443, 9443 } accept
    oifname "up0" meta skuid 0 ip daddr $UPSTREAM_DNS udp dport 53 accept
    oifname "up0" meta skuid 0 ip daddr $UPSTREAM_DNS tcp dport 53 accept
    oifname "up0" meta skuid 0 ip daddr $NTP_SERVERS udp dport 123 accept
    limit rate 5/minute log prefix "ASTA-FW-OUT-DROP "
    counter drop
  }
}
