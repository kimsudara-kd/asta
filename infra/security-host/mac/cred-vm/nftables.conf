#!/usr/sbin/nft -f
# ASTA Mac-mini deployment: credential VM "asta-cred" (Linux ARM64): vault + (future) connector ONLY.
# Nothing else runs here. DESIGN ARTIFACT (M3A-MAC-01); the services are M3-B, not authorized.
# Output only to the firewall VM's proxy; inbound only (future, commented) from asta-app on one port.
flush ruleset

define FW_IP = 10.77.2.1

table inet asta_cred {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    # (M3-B, NOT authorized, interface app0 not attached): intents from asta-app only
    #   iifname "app0" ip saddr 10.77.3.1 tcp dport 7443 accept
    limit rate 5/minute log prefix "ASTA-CRED-IN-DROP "
    counter drop
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    counter drop
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    oifname "fw0" ip daddr $FW_IP tcp dport 3128 accept
    limit rate 5/minute log prefix "ASTA-CRED-OUT-DROP "
    counter drop
  }
}
